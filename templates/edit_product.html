{% extends "layouts/base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Edit Product</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{{ url_for('products') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Products
        </a>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">Product Name</label>
                <select class="form-select" id="name" name="name" required>
                    <option value="" disabled>Select an item</option>
                    {% for item in items %}
                    <option value="{{ item.name }}" {% if product.name == item.name %}selected{% endif %}>{{ item.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="" disabled>Select category</option>
                    {% for category in categories %}
                    <option value="{{ category.name }}" {% if product.category == category.name %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="supplier_id" class="form-label">Supplier</label>
                <select class="form-select" id="supplier_id" name="supplier_id" required>
                    <option value="" selected disabled>Select a supplier</option>
                    {% for supplier in suppliers %}
                    <option value="{{ supplier.id }}" {% if product.supplier_id == supplier.id %}selected{% endif %}>{{ supplier.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="dealer_id" class="form-label">Dealer</label>
                <select class="form-select" id="dealer_id" name="dealer_id" required>
                    <option value="" selected disabled>Select a dealer</option>
                    {% for dealer in dealers %}
                    <option value="{{ dealer.id }}" {% if product.dealer_id == dealer.id %}selected{% endif %}>{{ dealer.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="buying_price" class="form-label">Buying Price</label>
                    <div class="input-group">
                        <span class="input-group-text">KSh</span>
                        <input type="number" step="0.01" class="form-control" id="buying_price" name="buying_price" value="{{ product.buying_price }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="selling_price" class="form-label">Selling Price</label>
                    <div class="input-group">
                        <span class="input-group-text">KSh</span>
                        <input type="number" step="0.01" class="form-control" id="selling_price" name="selling_price" value="{{ product.selling_price }}" required>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="stock" class="form-label">Initial Stock</label>
                    <input type="number" step="any" class="form-control" id="stock" name="stock" value="{{ product.current_stock }}" min="0" required>
                </div>
                <div class="col-md-6">
                    <label for="min_stock" class="form-label">Min Stock Level</label>
                    <input type="number" step="any" class="form-control" id="min_stock" name="min_stock" value="{{ product.min_stock_level }}" min="0" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="barcode" class="form-label">Barcode</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="barcode" name="barcode" value="{{ product.barcode }}" required>
                    <button class="btn btn-outline-primary" type="button" id="scan-barcode-btn" data-bs-toggle="modal" data-bs-target="#barcodeScannerModal">
                        <i class="bi bi-upc-scan"></i> Scan
                    </button>
                    <button class="btn btn-outline-secondary" type="button" id="generate-barcode-btn">
                        <i class="bi bi-upc"></i> Generate
                    </button>
                </div>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="vatable" name="vatable" {% if product.vatable %}checked{% endif %}>
                <label class="form-check-label" for="vatable">
                    Vatable
                </label>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>

<!-- Barcode Scanner Modal -->
<div class="modal fade" id="barcodeScannerModal" tabindex="-1" aria-labelledby="barcodeScannerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="barcodeScannerModalLabel">Barcode Scanner</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Point the camera at the barcode to scan
                </div>

                <div id="scanner-container" class="text-center">
                    <div id="interactive" class="viewport mb-3"></div>
                    <div class="scanner-overlay">
                        <div class="scanner-line"></div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="manual-barcode-input" placeholder="Or enter barcode manually">
                        <button class="btn btn-primary" type="button" id="manual-scan-confirm-btn">
                            <i class="bi bi-check-circle"></i> Confirm
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Quagga for barcode scanning -->
<script src="https://cdn.jsdelivr.net/npm/quagga/dist/quagga.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Prevent form submission on Enter in barcode field
    document.getElementById('barcode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('buying_price').focus();
        }
    });

    // Barcode Scanner Logic
    const barcodeScannerModal = new bootstrap.Modal(document.getElementById('barcodeScannerModal'));
    let scannerActive = false;
    let scannerInitialized = false;
    let lastScannedCode = null;
    let scanTimeout = null;

    // Initialize scanner when modal is shown
    document.getElementById('barcodeScannerModal').addEventListener('shown.bs.modal', function() {
        if (!scannerInitialized) {
            initBarcodeScanner();
            scannerInitialized = true;
        } else {
            startScanner();
        }
        document.getElementById('manual-barcode-input').value = '';
        lastScannedCode = null;
    });

    // Clean up scanner when modal is hidden
    document.getElementById('barcodeScannerModal').addEventListener('hidden.bs.modal', function() {
        stopScanner();
        clearTimeout(scanTimeout);
    });

    // Manual barcode confirmation
    document.getElementById('manual-scan-confirm-btn').addEventListener('click', function() {
        const barcode = document.getElementById('manual-barcode-input').value.trim();
        if (barcode) {
            processScannedBarcode(barcode);
            barcodeScannerModal.hide();
        } else {
            alert('Please enter a barcode');
        }
    });

    // Generate barcode button
    document.getElementById('generate-barcode-btn').addEventListener('click', function() {
        const randomBarcode = Math.floor(100000000000 + Math.random() * 900000000000).toString();
        document.getElementById('barcode').value = randomBarcode;
    });

    function initBarcodeScanner() {
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: {
                    width: 640,
                    height: 480,
                    facingMode: "environment"
                },
            },
            decoder: {
                readers: ["ean_reader", "ean_8_reader", "code_128_reader", "code_39_reader"],
                multiple: false
            },
            locate: true
        }, function(err) {
            if (err) {
                console.error("Scanner initialization error:", err);
                alert("Failed to initialize barcode scanner. Please use manual entry.");
                return;
            }
            startScanner();
        });

        Quagga.onDetected(function(result) {
            const code = result.codeResult.code;
            if (code === lastScannedCode) return;
            lastScannedCode = code;
            processScannedBarcode(code);
            scanTimeout = setTimeout(() => {
                stopScanner();
                barcodeScannerModal.hide();
            }, 500);
        });
    }

    function processScannedBarcode(barcode) {
        document.getElementById('barcode').value = barcode;
        document.getElementById('manual-barcode-input').value = barcode;
    }

    function startScanner() {
        if (!scannerActive && scannerInitialized) {
            Quagga.start();
            scannerActive = true;
        }
    }

    function stopScanner() {
        if (scannerActive) {
            Quagga.stop();
            scannerActive = false;
        }
    }
});
</script>

<style>
.viewport {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 0.25rem;
}
.viewport canvas, .viewport video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
#scanner-container {
    position: relative;
}
.scanner-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}
.scanner-line {
    position: absolute;
    width: 100%;
    height: 2px;
    background-color: rgba(255, 0, 0, 0.5);
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
    animation: scan 2s infinite linear;
}
@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}
canvas.drawing, canvas.drawingBuffer {
    position: absolute;
    left: 0;
    top: 0;
}
</style>
{% endblock %}
